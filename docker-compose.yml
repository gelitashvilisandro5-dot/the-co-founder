services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cofounder-app:local
    container_name: cofounder-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /var/www/html/google-key.json
      CLOUD_STORAGE_BUCKET: ${CLOUD_STORAGE_BUCKET:-${GOOGLE_STORAGE_BUCKET}}
    volumes:
      # Mount the project so code/config changes apply immediately without image rebuild.
      - ./:/var/www/html
      - /tmp/cofounder-cache:/tmp/cofounder_cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    image: node:20-alpine
    container_name: cofounder-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - app
    restart: unless-stopped

volumes:
  frontend_node_modules:
